name: Deploy Yoshlar-Ishi to Vercel

on:
  workflow_run:
    workflows: ["Yoshlar-Ishi Quality Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy after quality checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 59.19.1
    steps:
      - name: Check optional deployment credentials
        id: credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deployment is not configured yet. Add the VERCEL_TOKEN secret and VERCEL_ORG_ID / VERCEL_PROJECT_ID repository variables."
          fi

      - name: Checkout the tested commit
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Re-validate tested commit
        if: steps.credentials.outputs.configured == 'true'
        run: npm run check

      - name: Install pinned Vercel CLI
        if: steps.credentials.outputs.configured == 'true'
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Prepare project link metadata
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production settings
        if: steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build production output
        if: steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy production
        if: steps.credentials.outputs.configured == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --yes 2>&1 | tee /tmp/vercel-deploy.log
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1 || true)"
          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::warning::Vercel did not print a default vercel.app URL. Check the deployment in Vercel."
            exit 0
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment: $DEPLOYMENT_URL"

      - name: Smoke-test deployed public pages
        if: steps.credentials.outputs.configured == 'true' && steps.deploy.outputs.deployment_url != ''
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$SITE_URL/" -o /tmp/home.html
          grep -qi "Yoshlar-Ishi" /tmp/home.html
          curl --fail --silent --show-error --location --max-time 30 "$SITE_URL/admin.html" -o /tmp/admin.html
          grep -qi "Boshqaruv markazi" /tmp/admin.html
          curl --fail --silent --show-error --location --max-time 30 "$SITE_URL/privacy.html" -o /tmp/privacy.html
          grep -qi "Maxfiylik" /tmp/privacy.html
          curl --fail --silent --show-error --location --max-time 30 "$SITE_URL/manifest.webmanifest" -o /tmp/manifest.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/manifest.json','utf8'))"
          echo "Production smoke test passed for $SITE_URL"
