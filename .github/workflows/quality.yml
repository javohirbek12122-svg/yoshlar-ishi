name: Yoshlar-Ishi Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate site and dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Run static and syntax checks
        run: npm run check

      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium for mobile viewport tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive and runtime regression tests
        run: npm run check:mobile
