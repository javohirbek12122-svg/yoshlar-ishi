name: Yoshlar-Ishi Live Site Health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-health.yml"
      - "index.html"
      - "platform-polish.css"
      - "reference-home.css"
      - "biletlar.html"
      - "biletlar/**"
      - "biletlar-app.js"
      - "biletlar-data.js"
      - "biletlar.css"
      - "scripts/check-biletlar.mjs"
      - "site.css"
      - "mobile-guard.css"
      - "homepage-experience.css"
      - "homepage-experience.js"
      - "opportunity-page-filters.js"
      - "scripts/check-homepage-experience.mjs"
      - "design-system.css"
      - "DESIGN_BENCHMARK_100.md"
      - "DESIGN_SYSTEM.md"
      - "scripts/check-mobile.mjs"
      - "scripts/check-contrast.mjs"
      - "package.json"
      - "shared-theme.css"
      - "admin.html"
      - "privacy.html"
      - "robots.txt"
      - "manifest.webmanifest"
      - "admin-manifest.webmanifest"
      - "service-worker.js"
      - "supabase/migrations/**"
      - "pwa.js"
      - "offline.html"
      - "icon-192.png"
      - "icon-512.png"
      - "apple-touch-icon.png"
      - "vercel.json"
      - "scripts/check-pwa.mjs"
      - "scripts/check-government-pilot.mjs"
      - "government-pilot/**"
      - "icon.svg"
      - "davlat-xizmatlari.html"
      - "kabinet.html"
      - "hamjamiyat.html"
      - "hamjamiyat.js"
      - "hamjamiyat.css"
      - "startap-yoli.html"
      - "imkoniyatlar.html"
      - "supabase/migrations/**"
      - "scripts/check-site.mjs"
      - "laboratoriya.html"
      - "config.js"
      - "assessment.html"
      - "assessment.css"
      - "assessment.js"
      - "assessment-bank.js"
      - "scripts/check-assessment.mjs"

permissions:
  contents: read

jobs:
  health:
    name: Check public site endpoints
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://yoshlar-ishi-site.vercel.app
    steps:
      - name: Explain canonical production URL
        run: |
          echo "::notice::Live health checks use the canonical Yoshlar-Ishi Production project domain."
      - name: Check website, current feature set and admin page
        run: |
          set -euo pipefail
          case "$SITE_URL" in
            https://*) ;;
            *) echo "SITE_URL must start with https://"; exit 1 ;;
          esac
          BASE_URL="${SITE_URL%/}"
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/" -o /tmp/yoshlar-home.html
          # Wait briefly for the Vercel Git integration to finish the new production build.
          for attempt in $(seq 1 16); do
            if grep -Fq 'yi-quick-panel' /tmp/yoshlar-home.html && grep -Fq 'yi-hero-quote' /tmp/yoshlar-home.html && grep -Fq 'href="./reference-home.css"' /tmp/yoshlar-home.html && grep -Fq 'imkoniyatdan' /tmp/yoshlar-home.html && grep -Fq 'amaliy natijagacha.' /tmp/yoshlar-home.html; then break; fi
            if [ "$attempt" -eq 16 ]; then echo "::error::The redesigned homepage has not reached the production alias yet."; exit 1; fi
            sleep 5
            curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/" -o /tmp/yoshlar-home.html
          done
          grep -Fqi "yi-assessment-announcement" /tmp/yoshlar-home.html || { echo "::error::The homepage hero is missing the new assessment announcement."; exit 1; }
          grep -Fqi "SOON · TEZ KUNDA" /tmp/yoshlar-home.html || { echo "::error::The homepage hero is missing the upcoming partner-review notice."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/assessment.html" -o /tmp/yoshlar-assessment.html
          grep -Fqi "Bilim sinovlari" /tmp/yoshlar-assessment.html || { echo "::error::The competency assessment page is missing."; exit 1; }
          grep -Fqi "SOON" /tmp/yoshlar-assessment.html || { echo "::error::The partnership review announcement is missing."; exit 1; }
          grep -Fqi "Gumanitar fanlar" /tmp/yoshlar-assessment.html || { echo "::error::The humanities test track is missing."; exit 1; }
          for asset in assessment.css assessment-bank.js assessment.js; do curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/$asset" -o "/tmp/$asset"; done
          grep -Fqi "vocational" /tmp/assessment-bank.js || { echo "::error::The vocational question bank is missing."; exit 1; }
          grep -Fqi "submit_assessment_attempt" /tmp/assessment.js || { echo "::error::The secure assessment scoring client is missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/biletlar.html" -o /tmp/yoshlar-biletlar.html
          grep -Fqi "50 ta amaliy va startap bileti" /tmp/yoshlar-biletlar.html || { echo "::error::The ticket catalogue is not available."; exit 1; }
          for asset in biletlar.css biletlar-data.js biletlar-app.js; do curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/$asset" -o "/tmp/$asset"; done
          for i in $(seq 1 50); do id=$(printf "%03d" "$i"); curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/biletlar/$id.html" -o /tmp/bilet-page.html; grep -Fq "data-ticket=\"$id\"" /tmp/bilet-page.html || { echo "::error::Ticket page $id returned mismatched content."; exit 1; }; done
          grep -qi "Yoshlar-Ishi" /tmp/yoshlar-home.html
          grep -Fqi 'href="./site.css"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the consolidated design stylesheet link."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/site.css" -o /tmp/yoshlar-site.css
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/platform-polish.css" -o /tmp/yoshlar-platform-polish.css
          grep -Fq "yi-official-logo" /tmp/yoshlar-platform-polish.css || { echo "::error::The shared platform layout stylesheet is missing logo normalization."; exit 1; }
          grep -Fqi 'href="./reference-home.css"' /tmp/yoshlar-home.html || { echo "::error::The reference-led homepage stylesheet is not linked."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/reference-home.css" -o /tmp/yoshlar-reference-home.css
          grep -Fq ".yi-hero-quote" /tmp/yoshlar-reference-home.css || { echo "::error::The reference hero design layer is missing."; exit 1; }
          grep -Fq ".yi-quick-grid" /tmp/yoshlar-reference-home.css || { echo "::error::The redesigned quick-access layer is missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/mobile-guard.css" -o /tmp/yoshlar-mobile-guard.css
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/homepage-experience.css" -o /tmp/yoshlar-homepage-experience.css
          grep -Fqi ".yi-home-accordion" /tmp/yoshlar-homepage-experience.css || { echo "::error::The live homepage is missing the new expandable section styles."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/homepage-experience.js" -o /tmp/yoshlar-homepage-experience.js
          grep -Fqi "NESTED_GROUPS" /tmp/yoshlar-homepage-experience.js || { echo "::error::The live homepage is missing the modular interaction controller."; exit 1; }
          grep -Fqi 'design-system.css' /tmp/yoshlar-mobile-guard.css || { echo "::error::The live shared mobile stylesheet is not importing the unified design system."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/design-system.css" -o /tmp/yoshlar-design-system.css
          grep -Fqi -- '--navy:#123255' /tmp/yoshlar-design-system.css || { echo "::error::The live design system is missing the institutional navy token."; exit 1; }
          grep -Fqi '.sa-panel' /tmp/yoshlar-design-system.css || { echo "::error::The live design system is missing the state-service assistance component rules."; exit 1; }
          grep -Fqi -- '--muted:#53677b' /tmp/yoshlar-design-system.css || { echo "::error::The live design system's muted text token failed the revised WCAG contrast target."; exit 1; }
          grep -Fqi -- '--gold:#8a5814' /tmp/yoshlar-design-system.css || { echo "::error::The live warning text token is outdated."; exit 1; }
          grep -Fqi 'input::placeholder,textarea::placeholder{color:var(--muted)!important' /tmp/yoshlar-design-system.css || { echo "::error::The live placeholders are not using the AA contrast token."; exit 1; }


          grep -Fqi -- "--yi-mobile-tap-size:44px" /tmp/yoshlar-mobile-guard.css || { echo "::error::The live site is missing the 44px mobile touch-target rules."; exit 1; }
          grep -Fqi "@media(max-width:900px)" /tmp/yoshlar-mobile-guard.css || { echo "::error::The live site is missing the phone/tablet responsive rules."; exit 1; }
          if grep -Eqi "overflow-x:[[:space:]]*clip" /tmp/yoshlar-mobile-guard.css; then echo "::error::The live mobile stylesheet hides horizontal overflow instead of fixing layout."; exit 1; fi
          grep -Fqi -- '--navy:#123255' /tmp/yoshlar-site.css || { echo "::error::The live homepage stylesheet does not contain the current navy design tokens."; exit 1; }
          grep -Fqi '.compact-fold' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing its accessible collapsible-panel styles."; exit 1; }
          grep -Fqi '#backToTop.is-visible' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing the scroll-to-top control styles."; exit 1; }
          grep -Fqi '.showcase-empty-art' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing the real-project portfolio empty-state styles."; exit 1; }
          grep -Fqi '.detail-btn' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing the dynamic team interest button styles."; exit 1; }
          # Markers detect a reachable but outdated deployment, not just a successful HTTP response.
          grep -Fqi "imkoniyatdan" /tmp/yoshlar-home.html && grep -Fqi "amaliy natijagacha." /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: new Yoshlar-Ishi hero headline is missing."; exit 1; }
          grep -Fqi 'id="qo-shimcha-vositalar"' /tmp/yoshlar-home.html || { echo "::error::Homepage optional modules are not grouped."; exit 1; }
          grep -Fqi "IMKONIYAT · TAYYORGARLIK · ARIZA · NATIJA" /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: opportunity-to-outcome identity is missing."; exit 1; }
          grep -Fqi 'Bu forma davlat idorasiga ariza yubormaydi.' /tmp/yoshlar-home.html || { echo "::error::The live initiative form is unclear about not submitting to a government agency."; exit 1; }
          grep -Fqi 'Yuborgan tashabbus holati' /tmp/yoshlar-home.html || { echo "::error::The live homepage does not distinguish internal initiative tracking."; exit 1; }
          grep -Fqi 'Yoshlar-Ishi platformasi bergan ichki kuzatuv kodini kiriting.' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the internal tracking-code explanation."; exit 1; }
          grep -Fqi 'document.body.style.zoom=String(fontScale)' /tmp/yoshlar-home.html || { echo "::error::The live accessibility font-size controls are outdated."; exit 1; }
          grep -Fqi 'Loyiha va hamjamiyat vositalarini ko‘rish' /tmp/yoshlar-home.html || { echo "::error::The live secondary-tools fold label is outdated."; exit 1; }
          grep -Fqi 'href="./imkoniyatlar.html"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the opportunity catalogue route."; exit 1; }
          grep -Fqi 'class="hero-expanded-copy"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: expanded hero messaging is missing."; exit 1; }
          grep -Fqi 'class="yi-hero-quote"' /tmp/yoshlar-home.html || { echo "::error::The reference hero quote is missing."; exit 1; }
          grep -Fqi 'class="yi-register-link"' /tmp/yoshlar-home.html || { echo "::error::The registration action is missing."; exit 1; }
          grep -Fqi 'yi-hero-ribbon' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing its four-direction benefit ribbon."; exit 1; }
          grep -Fqi 'class="yi-official-resources"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the official resource logos."; exit 1; }
          grep -Fqi 'href="https://gov.uz/oz/yoshlar" target="_blank" rel="noopener noreferrer"' /tmp/yoshlar-home.html || { echo "::error::The Youth Affairs Agency official link is missing or unsafe."; exit 1; }
          grep -Fqi 'href="https://www.ustoz.ai/uz" target="_blank" rel="noopener noreferrer"' /tmp/yoshlar-home.html || { echo "::error::The Ustoz AI official link is missing or unsafe."; exit 1; }
          grep -Fqi 'https://uzchess.uz/images/partners/6/photo6fe378ad750c9351681f39aca9de5c32.png' /tmp/yoshlar-home.html || { echo "::error::The Agency logo asset is missing."; exit 1; }
          grep -Fqi 'https://uzreport.news/fotobank/image/2cbf2330eea2f444c4bf454a6b8f69e6.jpeg' /tmp/yoshlar-home.html || { echo "::error::The Ustoz AI logo asset is missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 'https://uzchess.uz/images/partners/6/photo6fe378ad750c9351681f39aca9de5c32.png' -o /tmp/yi-agency-logo.png
          file --mime-type /tmp/yi-agency-logo.png | grep -Eq 'image/(png|jpeg|webp)' || { echo "::error::The agency logo asset is not a supported image."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 'https://uzreport.news/fotobank/image/2cbf2330eea2f444c4bf454a6b8f69e6.jpeg' -o /tmp/yi-ustoz-logo.jpg
          file --mime-type /tmp/yi-ustoz-logo.jpg | grep -Eq 'image/(png|jpeg|webp)' || { echo "::error::The Ustoz AI logo asset is not a supported image."; exit 1; }
          grep -Fqi 'class="yi-quick-panel"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the quick-access panel."; exit 1; }
          grep -Fqi 'id="yiDrawerToggle"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing its three-line navigation trigger."; exit 1; }
          grep -Fqi 'id="yiSideDrawer"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing its side drawer."; exit 1; }
          grep -Fqi 'class="yi-quick-card-top"' /tmp/yoshlar-home.html || { echo "::error::The redesigned quick-access cards are missing."; exit 1; }
          grep -Fqi 'class="yi-partner-tags"' /tmp/yoshlar-home.html || { echo "::error::The partnership section is missing its contribution themes."; exit 1; }
          grep -Fqi 'id="yiSearchPanel"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing its working search panel."; exit 1; }
          grep -Fqi 'id="yiThemeToggle"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the theme control."; exit 1; }
          grep -Fqi 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JM13LmKQo41EGZkNQHbTC0mG4m/f0a06878-17e7-4fdb-94e6-0437ce7f174c.jpg' /tmp/yoshlar-homepage-experience.js || { echo "::error::The supplied homepage banner is missing from the live JavaScript."; exit 1; }
          grep -Fqi 'class="yi-hero-banner"' /tmp/yoshlar-homepage-experience.js || { echo "::error::The supplied banner image element is missing."; exit 1; }
          grep -Fqi 'yiHeroImageModal' /tmp/yoshlar-homepage-experience.js || { echo "::error::The accessible image viewer is missing."; exit 1; }
          grep -Fqi 'function setupHeroExperience' /tmp/yoshlar-homepage-experience.js || { echo "::error::The interactive hero controller is missing."; exit 1; }
          grep -Fqi '.yi-hero-casing' /tmp/yoshlar-reference-home.css || { echo "::error::The cinematic 3D hero frame styles are missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JM13LmKQo41EGZkNQHbTC0mG4m/f0a06878-17e7-4fdb-94e6-0437ce7f174c.jpg' -o /tmp/yoshlar-hero-banner.jpg
          file --mime-type /tmp/yoshlar-hero-banner.jpg | grep -Eq 'image/jpeg' || { echo "::error::The supplied hero banner is not a valid JPEG image."; exit 1; }
          grep -Fqi '2026-11-19: desktop and mobile hero redesign' /tmp/yoshlar-reference-home.css || { echo "::error::The new desktop/mobile hero layout is missing."; exit 1; }
          if grep -Fqi 'https://res.cloudinary.com/tourhq/image/upload/v1695112996/znj0avtophmpnvchl4ql.jpg' /tmp/yoshlar-reference-home.css; then echo "::error::The hero must not request the unrelated external plaza background."; exit 1; fi
          grep -Fqi 'body .hero .hero-focus' /tmp/yoshlar-reference-home.css || { echo "::error::The three visible platform directions are missing from the hero."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/opportunity-page-filters.js" -o /tmp/yoshlar-opportunity-filters.js
          grep -Fqi 'categoryFilter' /tmp/yoshlar-opportunity-filters.js || { echo "::error::The quick-access catalogue filters are missing."; exit 1; }
          grep -Fqi 'class="hero-storyline yi-hero-ribbon"' /tmp/yoshlar-home.html || { echo "::error::The hero benefit ribbon is not rendered."; exit 1; }
          grep -Fqi 'class="quickservice yi-quick-global' /tmp/yoshlar-home.html || { echo "::error::The international quick-access card is missing."; exit 1; }
          grep -Fqi 'id="afzalliklar"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: benefits section is missing."; exit 1; }
          grep -Fqi 'class="platform-proof yi-platform-proof"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing its translucent platform-proof strip."; exit 1; }
          grep -Fqi 'class="showcase-empty"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: portfolio-first showcase state is missing."; exit 1; }
          grep -Fqi 'action:"initiative_submit"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: server-side initiative submission marker is missing."; exit 1; }
          grep -Fqi '/functions/v1/community-submit' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: secure community endpoint is missing."; exit 1; }
          grep -Fqi 'id="teamBoardSearch"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: team matching filters are missing."; exit 1; }
          grep -Fqi 'id="teamBoardCategory"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: team category filter is missing."; exit 1; }
          grep -Fqi 'href="./laboratoriya.html"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the 3D laboratory navigation link."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/admin.html" -o /tmp/yoshlar-admin.html
          grep -qi "Boshqaruv markazi" /tmp/yoshlar-admin.html
          grep -Fqi 'id="otpPanel"' /tmp/yoshlar-admin.html || { echo "::error::The live admin page is missing its email OTP gate."; exit 1; }
          grep -Fqi 'id="passwordForm"' /tmp/yoshlar-admin.html || { echo "::error::The live admin page is missing its password fallback."; exit 1; }
          grep -Fqi 'rpc/admin_console_check' /tmp/yoshlar-admin.html || { echo "::error::The live admin page is missing its server-side allowlist check."; exit 1; }
          grep -Fqi 'create_user:false' /tmp/yoshlar-admin.html || { echo "::error::The live admin login must not permit automatic account creation."; exit 1; }
          if grep -Fqi 'create_user:true' /tmp/yoshlar-admin.html; then echo "::error::Unsafe self-signup marker found in admin page."; exit 1; fi
          grep -Fqi 'id="page-team"' /tmp/yoshlar-admin.html
          grep -Fqi 'id="page-showcase"' /tmp/yoshlar-admin.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/davlat-xizmatlari.html" -o /tmp/yoshlar-services.html
          grep -Fqi 'href="./shared-theme.css"' /tmp/yoshlar-services.html || { echo "::error::The live service directory is missing the shared visual theme."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/shared-theme.css" -o /tmp/yoshlar-shared-theme.css
          grep -Fqi -- '--blue:#15558a' /tmp/yoshlar-shared-theme.css || { echo "::error::The live shared theme does not contain the current brand palette."; exit 1; }
          grep -Fqi '.navlinks{' /tmp/yoshlar-shared-theme.css || { echo "::error::The live shared theme is missing the personal cabinet navigation styles."; exit 1; }
          grep -qi "Idorani toifasiga qarab toping" /tmp/yoshlar-services.html
          grep -qi "media-card" /tmp/yoshlar-services.html
          grep -Fqi 'https://gov.uz/oz/all_ministry/15' /tmp/yoshlar-services.html
          grep -Fqi 'class="media-fallback"' /tmp/yoshlar-services.html || { echo "::error::The live service gallery is missing its image-failure fallback."; exit 1; }
          grep -Fqi "URL’lar 2026-yil 29-oktabrda javob berish bo‘yicha tekshirilgan" /tmp/yoshlar-services.html || { echo "::error::The live service guide does not include the current verification caveat."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/kabinet.html" -o /tmp/yoshlar-cabinet.html
          grep -qi "Shaxsiy kabinet" /tmp/yoshlar-cabinet.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/hamjamiyat.html" -o /tmp/yoshlar-community.html
          grep -Fqi 'id="hpAuthGate"' /tmp/yoshlar-community.html || { echo "::error::Member login gate is missing."; exit 1; }
          grep -Fqi 'id="hpGoogleLogin"' /tmp/yoshlar-community.html || { echo "::error::Member Google OAuth entry is missing."; exit 1; }
          grep -Fqi 'id="hpTabProfile"' /tmp/yoshlar-community.html || { echo "::error::Member profile workspace is missing."; exit 1; }
          grep -Fqi 'id="hpTabActivity"' /tmp/yoshlar-community.html || { echo "::error::Member activity dashboard is missing."; exit 1; }
          grep -Fqi 'id="hpPostType"' /tmp/yoshlar-community.html || { echo "::error::Community post categories are missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/hamjamiyat.js" -o /tmp/yoshlar-community.js
          grep -Fqi 'post_type:postType' /tmp/yoshlar-community.js || { echo "::error::Post categories are not stored in Supabase."; exit 1; }
          grep -Fqi 'record_member_daily_visit' /tmp/yoshlar-community.js || { echo "::error::Daily activity tracking is missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/hamjamiyat.css" -o /tmp/yoshlar-community.css
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/auth-client.js" -o /tmp/yoshlar-auth-client.js
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/auth-bridge.js" -o /tmp/yoshlar-auth-bridge.js
          grep -Fq 'supabase.auth.getUser()' /tmp/yoshlar-auth-client.js || { echo "::error::Shared Supabase auth client does not verify the logged-in identity."; exit 1; }
          grep -Fq 'getIdentity: getVerifiedIdentity' /tmp/yoshlar-auth-bridge.js || { echo "::error::Shared auth bridge is missing the verified identity function."; exit 1; }
          grep -Fq 'id="hpRecoveryForm"' /tmp/yoshlar-community.html || { echo "::error::Password recovery UI is missing."; exit 1; }
          grep -Fq 'id="hpResendConfirmation"' /tmp/yoshlar-community.html || { echo "::error::Signup confirmation resend UI is missing."; exit 1; }
          grep -Fq 'YI_AUTH_READY' /tmp/yoshlar-cabinet.html || { echo "::error::Cabinet is not wired to the shared auth bridge."; exit 1; }
          grep -Fqi '.hp-drawer' /tmp/yoshlar-community.css || { echo "::error::Community drawer styles are missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/startap-yoli.html" -o /tmp/yoshlar-startup.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/laboratoriya.html" -o /tmp/yoshlar-lab.html
          grep -q "Fizikani kuzatma. <span" /tmp/yoshlar-lab.html
          grep -qi "Startap yo‘li" /tmp/yoshlar-startup.html
          grep -Fqi "https://uzcombinator.uz/apply" /tmp/yoshlar-startup.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/imkoniyatlar.html" -o /tmp/yoshlar-opportunities.html
          grep -Fq 'YI_AUTH_READY' /tmp/yoshlar-opportunities.html || { echo "::error::Opportunity catalogue is not connected to the shared account session."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/assessment.js" -o /tmp/yoshlar-assessment.js
          grep -Fq 'getVerifiedIdentity' /tmp/yoshlar-assessment.js || { echo "::error::Assessment page is not connected to the shared account session."; exit 1; }
          grep -qi "Yoshlar imkoniyatlari" /tmp/yoshlar-opportunities.html
          grep -Fqi "Arizaga tayyor bo‘ling." /tmp/yoshlar-opportunities.html || { echo "::error::Youth opportunity navigator is missing its application-preparation headline."; exit 1; }
          grep -Fqi "youth_opportunity_programs?select=" /tmp/yoshlar-opportunities.html || { echo "::error::Youth opportunity navigator is not connected to the Supabase programme catalogue."; exit 1; }
          grep -Fqi "function saveJourney()" /tmp/yoshlar-opportunities.html || { echo "::error::Youth opportunity progress-saving workflow is missing."; exit 1; }
          grep -Fqi "opportunity_journey_events?select=" /tmp/yoshlar-opportunities.html || { echo "::error::Private journey event history is missing."; exit 1; }
          grep -Fqi 'id="journeyTimeline"' /tmp/yoshlar-opportunities.html || { echo "::error::Journey event timeline UI is missing."; exit 1; }
          grep -Fqi "availability_status" /tmp/yoshlar-opportunities.html || { echo "::error::Opportunity application status model is missing."; exit 1; }
          grep -Fqi 'minAge===null?maxAge+" yoshgacha"' /tmp/yoshlar-opportunities.html || { echo "::error::The opportunity catalogue age range labels are outdated."; exit 1; }
          grep -Fqi "Ochiq qabul" /tmp/yoshlar-opportunities.html || { echo "::error::Opportunity status labels are missing."; exit 1; }
          grep -Fqi 'id="page-youth-programs"' /tmp/yoshlar-admin.html || { echo "::error::Admin panel is missing youth-programme management."; exit 1; }
          grep -Fqi 'id="programAvailabilityStatus"' /tmp/yoshlar-admin.html || { echo "::error::Admin application-status selector is missing."; exit 1; }
          grep -Fqi "function saveYouthProgram(ev)" /tmp/yoshlar-admin.html || { echo "::error::Admin panel cannot manage youth programmes."; exit 1; }
          grep -Fqi "function scoresFor(stage,goal,sector,source)" /tmp/yoshlar-startup.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/state-service-assistant.js" -o /tmp/yoshlar-service-helper.js
          grep -Fq "var routes=" /tmp/yoshlar-service-helper.js || { echo "::error::Cross-portal service helper script is missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/state-service-assistant.css" -o /tmp/yoshlar-service-helper.css
          grep -Fq ".state-assist" /tmp/yoshlar-service-helper.css || { echo "::error::Cross-portal service helper styles are missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/privacy.html" -o /tmp/yoshlar-privacy.html
          grep -qi "Maxfiylik" /tmp/yoshlar-privacy.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/manifest.webmanifest" -o /tmp/yoshlar-manifest.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/yoshlar-manifest.json','utf8'))"
          grep -Fq '"sizes": "192x192"' /tmp/yoshlar-manifest.json || { echo "::error::The live PWA manifest is missing a 192px icon."; exit 1; }
          grep -Fq '"sizes": "512x512"' /tmp/yoshlar-manifest.json || { echo "::error::The live PWA manifest is missing a 512px icon."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/service-worker.js" -o /tmp/yoshlar-service-worker.js
          grep -Fq 'const CACHE_NAME = "yi-pwa-v28";' /tmp/yoshlar-service-worker.js || { echo "::error::The production service worker cache version is outdated; expected yi-pwa-v28."; exit 1; }
          grep -Fq 'CACHEABLE_EXTERNAL_IMAGE_ORIGINS' /tmp/yoshlar-service-worker.js || { echo "::error::The production service worker is missing cross-origin hero image caching."; exit 1; }
          grep -Fq '"/offline.html"' /tmp/yoshlar-service-worker.js || { echo "::error::The live service worker has no offline page."; exit 1; }
          grep -Fq '"/kabinet.html"' /tmp/yoshlar-service-worker.js || { echo "::error::Private pages are not explicitly excluded from offline caching."; exit 1; }
          grep -Fq '"/hamjamiyat.html"' /tmp/yoshlar-service-worker.js || { echo "::error::Community profiles are not explicitly excluded from offline caching."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/pwa.js" -o /tmp/yoshlar-pwa.js
          grep -Fq 'beforeinstallprompt' /tmp/yoshlar-pwa.js
          grep -Fq 'Add to Home Screen' /tmp/yoshlar-pwa.js
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/offline.html" -o /tmp/yoshlar-offline.html
          grep -Fq 'Hozir internet aloqasi yo‘q' /tmp/yoshlar-offline.html
          for ICON in icon-192.png icon-512.png apple-touch-icon.png; do
            curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/$ICON" -o "/tmp/$ICON"
            file "/tmp/$ICON" | grep -Fq 'PNG image data' || { echo "::error::$ICON is not a valid PNG image."; exit 1; }
          done
          ADMIN_HEADERS="$(curl --fail --silent --show-error --location --head --max-time 30 "$BASE_URL/admin.html" | tr -d '\r')"
          CABINET_HEADERS="$(curl --fail --silent --show-error --location --head --max-time 30 "$BASE_URL/kabinet.html" | tr -d '\r')"
          COMMUNITY_HEADERS="$(curl --fail --silent --show-error --location --head --max-time 30 "$BASE_URL/hamjamiyat.html" | tr -d '\r')"
          grep -Eiq 'cache-control:.*no-store' <<< "$ADMIN_HEADERS" || { echo "::error::Admin HTML must be no-store."; exit 1; }
          grep -Eiq 'cache-control:.*no-store' <<< "$CABINET_HEADERS" || { echo "::error::Personal cabinet HTML must be no-store."; exit 1; }
          grep -Eiq 'cache-control:.*no-store' <<< "$COMMUNITY_HEADERS" || { echo "::error::Community account HTML must be no-store."; exit 1; }
          grep -Eiq 'x-content-type-options: nosniff' <<< "$ADMIN_HEADERS" || { echo "::error::Security headers are not present on the live site."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/icon.svg" -o /tmp/yoshlar-icon.svg
          grep -q "<svg" /tmp/yoshlar-icon.svg
          echo "Health check passed for the current Yoshlar-Ishi feature set at $BASE_URL"
      - name: Checkout tested source for mobile browser tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js for production mobile tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned Playwright dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium for production mobile tests
        run: npx playwright install --with-deps chromium
      - name: Test the live production domain at mobile, tablet and desktop widths
        env:
          MOBILE_BASE_URL: https://yoshlar-ishi-site.vercel.app
        run: npm run check:contrast && npm run check:pwa && npm run check:government && npm run check:mobile
