name: Yoshlar-Ishi Live Site Health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-health.yml"
      - "index.html"
      - "site.css"
      - "mobile-guard.css"
      - "design-system.css"
      - "DESIGN_BENCHMARK_100.md"
      - "DESIGN_SYSTEM.md"
      - "scripts/check-mobile.mjs"
      - "scripts/check-contrast.mjs"
      - "package.json"
      - "shared-theme.css"
      - "admin.html"
      - "privacy.html"
      - "robots.txt"
      - "manifest.webmanifest"
      - "admin-manifest.webmanifest"
      - "service-worker.js"
      - "pwa.js"
      - "offline.html"
      - "icon-192.png"
      - "icon-512.png"
      - "apple-touch-icon.png"
      - "vercel.json"
      - "scripts/check-pwa.mjs"
      - "scripts/check-government-pilot.mjs"
      - "government-pilot/**"
      - "icon.svg"
      - "davlat-xizmatlari.html"
      - "kabinet.html"
      - "startap-yoli.html"
      - "imkoniyatlar.html"
      - "supabase/migrations/**"
      - "scripts/check-site.mjs"
      - "laboratoriya.html"
      - "config.js"

permissions:
  contents: read

jobs:
  health:
    name: Check public site endpoints
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://yoshlar-ishi-site.vercel.app' }}
    steps:
      - name: Explain missing live URL
        if: ${{ vars.SITE_URL == '' }}
        run: |
          echo "::notice::SITE_URL is unset; checking the known production alias https://yoshlar-ishi-site.vercel.app. Set SITE_URL only if the canonical domain changes."
      - name: Check website, current feature set and admin page
        run: |
          set -euo pipefail
          case "$SITE_URL" in
            https://*) ;;
            *) echo "SITE_URL must start with https://"; exit 1 ;;
          esac
          BASE_URL="${SITE_URL%/}"
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/" -o /tmp/yoshlar-home.html
          grep -qi "Yoshlar-Ishi" /tmp/yoshlar-home.html
          grep -Fqi 'href="./site.css"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the consolidated design stylesheet link."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/site.css" -o /tmp/yoshlar-site.css
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/mobile-guard.css" -o /tmp/yoshlar-mobile-guard.css
          grep -Fqi 'design-system.css' /tmp/yoshlar-mobile-guard.css || { echo "::error::The live shared mobile stylesheet is not importing the unified design system."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/design-system.css" -o /tmp/yoshlar-design-system.css
          grep -Fqi -- '--navy:#123255' /tmp/yoshlar-design-system.css || { echo "::error::The live design system is missing the institutional navy token."; exit 1; }
          grep -Fqi '.sa-panel' /tmp/yoshlar-design-system.css || { echo "::error::The live design system is missing the state-service assistance component rules."; exit 1; }
          grep -Fqi -- '--muted:#53677b' /tmp/yoshlar-design-system.css || { echo "::error::The live design system's muted text token failed the revised WCAG contrast target."; exit 1; }
          grep -Fqi -- '--gold:#8a5814' /tmp/yoshlar-design-system.css || { echo "::error::The live warning text token is outdated."; exit 1; }
          grep -Fqi 'input::placeholder,textarea::placeholder{color:var(--muted)!important' /tmp/yoshlar-design-system.css || { echo "::error::The live placeholders are not using the AA contrast token."; exit 1; }


          grep -Fqi -- "--yi-mobile-tap-size:44px" /tmp/yoshlar-mobile-guard.css || { echo "::error::The live site is missing the 44px mobile touch-target rules."; exit 1; }
          grep -Fqi "@media(max-width:900px)" /tmp/yoshlar-mobile-guard.css || { echo "::error::The live site is missing the phone/tablet responsive rules."; exit 1; }
          if grep -Eqi "overflow-x:[[:space:]]*clip" /tmp/yoshlar-mobile-guard.css; then echo "::error::The live mobile stylesheet hides horizontal overflow instead of fixing layout."; exit 1; fi
          grep -Fqi -- '--navy:#123255' /tmp/yoshlar-site.css || { echo "::error::The live homepage stylesheet does not contain the current navy design tokens."; exit 1; }
          grep -Fqi '.compact-fold' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing its accessible collapsible-panel styles."; exit 1; }
          grep -Fqi '#backToTop.is-visible' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing the scroll-to-top control styles."; exit 1; }
          grep -Fqi '.showcase-empty-art' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing the real-project portfolio empty-state styles."; exit 1; }
          grep -Fqi '.detail-btn' /tmp/yoshlar-site.css || { echo "::error::The live homepage is missing the dynamic team interest button styles."; exit 1; }
          # Markers detect a reachable but outdated deployment, not just a successful HTTP response.
          grep -Fqi "Imkoniyatni top." /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: current opportunity-first headline is missing."; exit 1; }
          grep -Fqi 'id="qo-shimcha-vositalar"' /tmp/yoshlar-home.html || { echo "::error::Homepage optional modules are not grouped."; exit 1; }
          grep -Fqi "IMKONIYAT · ARIZA · ISHTIROK · NATIJA" /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: opportunity-to-outcome identity is missing."; exit 1; }
          grep -Fqi 'Bu forma davlat idorasiga ariza yubormaydi.' /tmp/yoshlar-home.html || { echo "::error::The live initiative form is unclear about not submitting to a government agency."; exit 1; }
          grep -Fqi 'Yuborgan tashabbus holati' /tmp/yoshlar-home.html || { echo "::error::The live homepage does not distinguish internal initiative tracking."; exit 1; }
          grep -Fqi 'Yoshlar-Ishi platformasi bergan ichki kuzatuv kodini kiriting.' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the internal tracking-code explanation."; exit 1; }
          grep -Fqi 'document.body.style.zoom=String(fontScale)' /tmp/yoshlar-home.html || { echo "::error::The live accessibility font-size controls are outdated."; exit 1; }
          grep -Fqi 'Loyiha va hamjamiyat vositalarini ko‘rish' /tmp/yoshlar-home.html || { echo "::error::The live secondary-tools fold label is outdated."; exit 1; }
          grep -Fqi 'href="./imkoniyatlar.html"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the opportunity catalogue route."; exit 1; }
          grep -Fqi 'class="hero-expanded-copy"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: expanded hero messaging is missing."; exit 1; }
          grep -Fqi 'class="hero-storyline"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: five-stage journey strip is missing."; exit 1; }
          grep -Fqi 'id="afzalliklar"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: benefits section is missing."; exit 1; }
          grep -Fqi 'class="platform-proof"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: feature proof strip is missing."; exit 1; }
          grep -Fqi 'class="showcase-empty"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: portfolio-first showcase state is missing."; exit 1; }
          grep -Fqi 'action:"initiative_submit"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: server-side initiative submission marker is missing."; exit 1; }
          grep -Fqi '/functions/v1/community-submit' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: secure community endpoint is missing."; exit 1; }
          grep -Fqi 'id="teamBoardSearch"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: team matching filters are missing."; exit 1; }
          grep -Fqi 'id="teamBoardCategory"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is outdated: team category filter is missing."; exit 1; }
          grep -Fqi 'href="./laboratoriya.html"' /tmp/yoshlar-home.html || { echo "::error::The live homepage is missing the 3D laboratory navigation link."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/admin.html" -o /tmp/yoshlar-admin.html
          grep -qi "Boshqaruv markazi" /tmp/yoshlar-admin.html
          grep -Fqi 'id="otpPanel"' /tmp/yoshlar-admin.html || { echo "::error::The live admin page is missing its email OTP gate."; exit 1; }
          grep -Fqi 'id="passwordForm"' /tmp/yoshlar-admin.html || { echo "::error::The live admin page is missing its password fallback."; exit 1; }
          grep -Fqi 'rpc/admin_console_check' /tmp/yoshlar-admin.html || { echo "::error::The live admin page is missing its server-side allowlist check."; exit 1; }
          grep -Fqi 'create_user:false' /tmp/yoshlar-admin.html || { echo "::error::The live admin login must not permit automatic account creation."; exit 1; }
          if grep -Fqi 'create_user:true' /tmp/yoshlar-admin.html; then echo "::error::Unsafe self-signup marker found in admin page."; exit 1; fi
          grep -Fqi 'id="page-team"' /tmp/yoshlar-admin.html
          grep -Fqi 'id="page-showcase"' /tmp/yoshlar-admin.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/davlat-xizmatlari.html" -o /tmp/yoshlar-services.html
          grep -Fqi 'href="./shared-theme.css"' /tmp/yoshlar-services.html || { echo "::error::The live service directory is missing the shared visual theme."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/shared-theme.css" -o /tmp/yoshlar-shared-theme.css
          grep -Fqi -- '--blue:#15558a' /tmp/yoshlar-shared-theme.css || { echo "::error::The live shared theme does not contain the current brand palette."; exit 1; }
          grep -Fqi '.navlinks{' /tmp/yoshlar-shared-theme.css || { echo "::error::The live shared theme is missing the personal cabinet navigation styles."; exit 1; }
          grep -qi "Idorani toifasiga qarab toping" /tmp/yoshlar-services.html
          grep -qi "media-card" /tmp/yoshlar-services.html
          grep -Fqi 'https://gov.uz/oz/all_ministry/15' /tmp/yoshlar-services.html
          grep -Fqi 'class="media-fallback"' /tmp/yoshlar-services.html || { echo "::error::The live service gallery is missing its image-failure fallback."; exit 1; }
          grep -Fqi "URL’lar 2026-yil 29-oktabrda javob berish bo‘yicha tekshirilgan" /tmp/yoshlar-services.html || { echo "::error::The live service guide does not include the current verification caveat."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/kabinet.html" -o /tmp/yoshlar-cabinet.html
          grep -qi "Shaxsiy kabinet" /tmp/yoshlar-cabinet.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/startap-yoli.html" -o /tmp/yoshlar-startup.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/laboratoriya.html" -o /tmp/yoshlar-lab.html
          grep -q "Fizikani kuzatma. <span" /tmp/yoshlar-lab.html
          grep -qi "Startap yo‘li" /tmp/yoshlar-startup.html
          grep -Fqi "https://uzcombinator.uz/apply" /tmp/yoshlar-startup.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/imkoniyatlar.html" -o /tmp/yoshlar-opportunities.html
          grep -qi "Yoshlar imkoniyatlari" /tmp/yoshlar-opportunities.html
          grep -Fqi "Arizaga tayyor bo‘ling." /tmp/yoshlar-opportunities.html || { echo "::error::Youth opportunity navigator is missing its application-preparation headline."; exit 1; }
          grep -Fqi "youth_opportunity_programs?select=" /tmp/yoshlar-opportunities.html || { echo "::error::Youth opportunity navigator is not connected to the Supabase programme catalogue."; exit 1; }
          grep -Fqi "function saveJourney()" /tmp/yoshlar-opportunities.html || { echo "::error::Youth opportunity progress-saving workflow is missing."; exit 1; }
          grep -Fqi "opportunity_journey_events?select=" /tmp/yoshlar-opportunities.html || { echo "::error::Private journey event history is missing."; exit 1; }
          grep -Fqi 'id="journeyTimeline"' /tmp/yoshlar-opportunities.html || { echo "::error::Journey event timeline UI is missing."; exit 1; }
          grep -Fqi "availability_status" /tmp/yoshlar-opportunities.html || { echo "::error::Opportunity application status model is missing."; exit 1; }
          grep -Fqi 'minAge===null?maxAge+" yoshgacha"' /tmp/yoshlar-opportunities.html || { echo "::error::The opportunity catalogue age range labels are outdated."; exit 1; }
          grep -Fqi "Ochiq qabul" /tmp/yoshlar-opportunities.html || { echo "::error::Opportunity status labels are missing."; exit 1; }
          grep -Fqi 'id="page-youth-programs"' /tmp/yoshlar-admin.html || { echo "::error::Admin panel is missing youth-programme management."; exit 1; }
          grep -Fqi 'id="programAvailabilityStatus"' /tmp/yoshlar-admin.html || { echo "::error::Admin application-status selector is missing."; exit 1; }
          grep -Fqi "function saveYouthProgram(ev)" /tmp/yoshlar-admin.html || { echo "::error::Admin panel cannot manage youth programmes."; exit 1; }
          grep -Fqi "function scoresFor(stage,goal,sector,source)" /tmp/yoshlar-startup.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/state-service-assistant.js" -o /tmp/yoshlar-service-helper.js
          grep -Fq "var routes=" /tmp/yoshlar-service-helper.js || { echo "::error::Cross-portal service helper script is missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/state-service-assistant.css" -o /tmp/yoshlar-service-helper.css
          grep -Fq ".state-assist" /tmp/yoshlar-service-helper.css || { echo "::error::Cross-portal service helper styles are missing."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/privacy.html" -o /tmp/yoshlar-privacy.html
          grep -qi "Maxfiylik" /tmp/yoshlar-privacy.html
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/manifest.webmanifest" -o /tmp/yoshlar-manifest.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/yoshlar-manifest.json','utf8'))"
          grep -Fq '"sizes": "192x192"' /tmp/yoshlar-manifest.json || { echo "::error::The live PWA manifest is missing a 192px icon."; exit 1; }
          grep -Fq '"sizes": "512x512"' /tmp/yoshlar-manifest.json || { echo "::error::The live PWA manifest is missing a 512px icon."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/service-worker.js" -o /tmp/yoshlar-service-worker.js
          grep -Fq '"/offline.html"' /tmp/yoshlar-service-worker.js || { echo "::error::The live service worker has no offline page."; exit 1; }
          grep -Fq '"/kabinet.html"' /tmp/yoshlar-service-worker.js || { echo "::error::Private pages are not explicitly excluded from offline caching."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/pwa.js" -o /tmp/yoshlar-pwa.js
          grep -Fq 'beforeinstallprompt' /tmp/yoshlar-pwa.js
          grep -Fq 'Add to Home Screen' /tmp/yoshlar-pwa.js
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/offline.html" -o /tmp/yoshlar-offline.html
          grep -Fq 'Hozir internet aloqasi yo‘q' /tmp/yoshlar-offline.html
          for ICON in icon-192.png icon-512.png apple-touch-icon.png; do
            curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/$ICON" -o "/tmp/$ICON"
            file "/tmp/$ICON" | grep -Fq 'PNG image data' || { echo "::error::$ICON is not a valid PNG image."; exit 1; }
          done
          ADMIN_HEADERS="$(curl --fail --silent --show-error --location --head --max-time 30 "$BASE_URL/admin.html" | tr -d '\r')"
          CABINET_HEADERS="$(curl --fail --silent --show-error --location --head --max-time 30 "$BASE_URL/kabinet.html" | tr -d '\r')"
          grep -Eiq 'cache-control:.*no-store' <<< "$ADMIN_HEADERS" || { echo "::error::Admin HTML must be no-store."; exit 1; }
          grep -Eiq 'cache-control:.*no-store' <<< "$CABINET_HEADERS" || { echo "::error::Personal cabinet HTML must be no-store."; exit 1; }
          grep -Eiq 'x-content-type-options: nosniff' <<< "$ADMIN_HEADERS" || { echo "::error::Security headers are not present on the live site."; exit 1; }
          curl --fail --silent --show-error --location --max-time 30 "$BASE_URL/icon.svg" -o /tmp/yoshlar-icon.svg
          grep -q "<svg" /tmp/yoshlar-icon.svg
          echo "Health check passed for the current Yoshlar-Ishi feature set at $BASE_URL"
      - name: Checkout tested source for mobile browser tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js for production mobile tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install pinned Playwright dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium for production mobile tests
        run: npx playwright install --with-deps chromium
      - name: Test the live production domain at mobile, tablet and desktop widths
        env:
          MOBILE_BASE_URL: ${{ vars.SITE_URL || 'https://yoshlar-ishi-site.vercel.app' }}
        run: npm run check:contrast && npm run check:pwa && npm run check:government && npm run check:mobile
